<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Display lighting</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main id="app" class="app">
      <header class="top">
        <h1>Display lighting</h1>
        <p id="status" class="status">Connecting…</p>
      </header>
      <section class="block" aria-label="Control">
        <h2>Control</h2>
        <div class="row" id="control-row"></div>
      </section>
      <section class="block" aria-label="Glass mode">
        <h2>Glass</h2>
        <div class="row" id="mode-row"></div>
        <div class="bright">
          <button type="button" class="hit" id="bright-down" aria-label="Dimmer">
            −
          </button>
          <div class="bright-read">
            <span id="bright-value">100 %</span>
            <span class="hint">0–100% · step 10%</span>
          </div>
          <button type="button" class="hit" id="bright-up" aria-label="Brighter">
            +
          </button>
        </div>
      </section>
      <section class="block" aria-label="Instruments">
        <h2>Instruments</h2>
        <div id="devices"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
